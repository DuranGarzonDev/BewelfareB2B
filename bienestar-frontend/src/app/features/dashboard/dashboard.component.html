<div *ngIf="showToast" [@toastAnimation] class="fixed top-5 right-5 z-50 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
  <span class="font-medium">{{ toastMessage }}</span>
</div>

<div class="min-h-screen bg-gray-100 flex">
  
  <aside class="w-64 bg-indigo-700 text-white flex flex-col shadow-xl">
    <div class="p-6 font-bold text-2xl flex items-center gap-3 border-b border-indigo-600">
      <svg class="w-8 h-8 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span>BWelfare</span>
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a href="#" class="block py-3 px-4 rounded-lg bg-indigo-800 text-white font-medium transition shadow-inner">Inicio</a>
      <a href="#" class="block py-3 px-4 rounded-lg hover:bg-indigo-600 text-indigo-100 transition">Mis Pausas Activas</a>
      <a href="#" class="block py-3 px-4 rounded-lg hover:bg-indigo-600 text-indigo-100 transition">Estadísticas</a>
    </nav>

    <div class="p-4 border-t border-indigo-600">
      <button (click)="logout()" class="w-full flex justify-center items-center gap-2 py-3 bg-red-500 hover:bg-red-600 rounded-lg text-white font-medium transition-colors shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    
    <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-8 border border-gray-100">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-800">Panel de Control</h1>
        <p class="text-gray-500 mt-1">¡Qué bueno verte de nuevo por aquí!</p>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="text-right hidden md:block">
          <p class="text-sm font-bold text-gray-900">{{ userName }}</p>
          <p class="text-xs font-medium text-indigo-600 bg-indigo-50 inline-block px-2 py-1 rounded-full mt-1">
            {{ role === 'EMPLOYEE' ? 'Empleado' : role }}
          </p>
        </div>
        <div class="h-12 w-12 rounded-full bg-indigo-100 border-2 border-indigo-200 flex justify-center items-center text-indigo-700 font-bold text-xl uppercase shadow-sm">
          {{ userName ? userName.charAt(0) : 'U' }}
        </div>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-indigo-500 hover:shadow-md transition">
        <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Pausas Completadas</h3>
        <p class="text-4xl font-extrabold text-gray-800 mt-2">0</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-green-500 hover:shadow-md transition">
        <h3 class="text-gray-500 text-sm font-medium uppercase tracking-wider">Racha Actual</h3>
        <p class="text-4xl font-extrabold text-gray-800 mt-2">0 <span class="text-lg text-gray-400 font-normal">Días</span></p>
      </div>
    </div>
    
  </main>
</div>
