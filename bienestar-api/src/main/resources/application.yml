spring:
  application:
    name: bienestar-api

  # Conexión a PostgreSQL (Datos Relacionales)
  datasource:
    url: jdbc:postgresql://localhost:5433/bienestar_db
    username: root
    password: rootpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Conexión a MongoDB (Analítica y Documentos)
  mongodb:
    uri: mongodb://localhost:27017/bienestar_analytics_db

# Puerto donde correrá nuestro Backend
server:
  port: 8080

# Configuración JWT Personalizada
